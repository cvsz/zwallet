apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwallet-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zwallet-gateway
  template:
    metadata:
      labels:
        app: zwallet-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/zwallet-gateway:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zwallet-secrets
                  key: db_url
            # Required shared Redis endpoint; do not fall back to pod-local localhost.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: zwallet-secrets
                  key: redis_url
            # These optional references keep the rest of the gateway available while
            # issuer webhook admission remains fail-closed until operators provision them.
            - name: ISSUER_ID
              valueFrom:
                configMapKeyRef:
                  name: zwallet-config
                  key: issuer_id
                  optional: true
            - name: ISSUER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: zwallet-secrets
                  key: issuer_webhook_secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zwallet-gateway
spec:
  selector:
    app: zwallet-gateway
  ports:
    - port: 80
      targetPort: 8080
