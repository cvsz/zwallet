name: Workflow Boundary Contract

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/security/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "scripts/security/**"

permissions:
  contents: read

concurrency:
  group: workflow-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify Node runtime
        run: node --version

      - name: Run workflow security contract tests
        run: node --test scripts/security/workflow-boundary.test.mjs
