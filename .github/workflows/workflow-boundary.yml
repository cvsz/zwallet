name: Workflow Trust Boundary

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/security/workflow-boundary.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/security/workflow-boundary.test.mjs"

permissions:
  contents: read

concurrency:
  group: workflow-trust-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run workflow trust-boundary regression tests
        run: node --test scripts/security/workflow-boundary.test.mjs
