name: Chaos Safety Contract

on:
  pull_request:
    paths:
      - ".github/workflows/chaos.yml"
      - "tests/chaos/**"
      - "scripts/security/workflow-boundary.test.mjs"

permissions:
  contents: read

concurrency:
  group: chaos-safety-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate chaos script syntax without executing it
        shell: bash
        run: bash -n tests/chaos/kill-pod.sh

      - name: Run workflow security contract tests
        run: node --test scripts/security/workflow-boundary.test.mjs
