name: SSOT Enforcement

on:
  pull_request:

jobs:
  ssot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check forbidden patterns
        run: |
          if git grep -n "process.env" -- . ':(exclude).github/workflows/ssot-enforcement.yml'; then
            echo "❌ Env secrets not allowed"
            exit 1
          fi

          if git grep -n "x-client-cert" -- . ':(exclude).github/workflows/ssot-enforcement.yml'; then
            echo "❌ Header trust violation"
            exit 1
          fi
