name: SSOT Enforcement

on:
  pull_request:

permissions:
  contents: read

jobs:
  ssot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check forbidden runtime source patterns
        run: |
          set -euo pipefail
          python3 scripts/ci/check_forbidden_patterns.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
