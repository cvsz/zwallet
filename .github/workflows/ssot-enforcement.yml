name: SSOT Enforcement

on:
  pull_request:

permissions:
  contents: read

jobs:
  ssot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked secret material
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tracked_env < <(
            git ls-files \
              | grep -E '(^|/)\.env($|\.)' \
              | grep -Ev '\.(example|sample|template)$' \
              || true
          )
          mapfile -t tracked_keys < <(
            git ls-files \
              | grep -E '(^|/)(id_rsa|id_ed25519|credentials\.json|service-account\.json|.*\.(pem|key))$' \
              || true
          )
          if (( ${#tracked_env[@]} + ${#tracked_keys[@]} > 0 )); then
            printf 'Tracked secret material is not allowed:\n'
            printf '%s\n' "${tracked_env[@]}" "${tracked_keys[@]}"
            exit 1
          fi

      - name: Reject direct client-certificate header trust
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i -E '["'"'"']x-client-cert["'"'"']' -- \
            ':!docs/**' \
            ':!scripts/archive/**' \
            ':!.github/workflows/ssot-enforcement.yml'; then
            echo "Direct x-client-cert header trust is forbidden; terminate and verify mTLS at the trusted ingress boundary"
            exit 1
          fi
