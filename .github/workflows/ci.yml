name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Verify wallet transfer execution containment
        run: node --test scripts/security/transfer-execution-containment.test.mjs
      - name: Build RPC workspace types before dependent typechecks
        run: pnpm --filter @zwallet/rpc build
      - name: Typecheck wallet engine
        run: pnpm --filter @zwallet/wallet-engine typecheck
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:circular
