name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - name: Build admin-wallet dependency graph
        run: pnpm --filter '@zwallet/admin-wallet...' --if-present run build
      - name: Test bounded admin-wallet request parsing
        run: pnpm --filter @zwallet/admin-wallet test
      - run: pnpm lint
      - run: pnpm check:circular
