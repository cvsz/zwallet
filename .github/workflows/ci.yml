name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Gateway unit and Redis integration tests
        run: pnpm --filter @zwallet/gateway test
        env:
          REDIS_URL: redis://localhost:6379/15
      - name: Gateway TypeScript build
        run: pnpm --filter @zwallet/gateway build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:circular
