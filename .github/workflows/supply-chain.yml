name: Supply Chain Security

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-secure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_REF: zwallet-api:ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned uv lock compiler
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.10.0
          enable-cache: false

      - name: Compile hash-locked Python dependency candidate
        run: uv pip compile api/requirements.in --output-file /tmp/zwallet-api-requirements.txt --generate-hashes --python-version 3.12

      - name: Upload dependency lock candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-requirements-${{ github.sha }}
          path: /tmp/zwallet-api-requirements.txt
          if-no-files-found: error
          retention-days: 7

      - name: Require committed hash lock to match the compiler output
        run: diff -u api/requirements.txt /tmp/zwallet-api-requirements.txt

      - name: Build local image for scanning (no registry credentials)
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag "$IMAGE_REF" ./api

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          ignore-unfixed: true

      - name: Generate local SBOM (CycloneDX)
        uses: anchore/sbom-action@c7f031d9249a826a082ea14c79d3b686a51d485a # v0.15.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false

      - name: Upload SBOM evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 30
